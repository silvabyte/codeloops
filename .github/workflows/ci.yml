name: Session History
on:
  push:
    branches: [main, feat/session-memory-rust]
  pull_request:
    branches: [main, feat/session-memory-rust]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: make check
      - run: make install PREFIX="$RUNNER_TEMP/codeloops-preview"
